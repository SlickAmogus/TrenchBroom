{
    "version": 9,
    "name": "Silent Hill",
    "fileformats": [
        { "format": "Quake3 (Valve)" }
    ],
    "filesystem": {
        "searchpath": ".",
        "packageformat": { "extension": ".pak", "format": "idpak" }
    },
    "materials": {
        "root": "textures",
        "extensions": [ ".png" ]
    },
    "entities": {
        "definitions": [ "SilentHill.fgd" ],
        "defaultcolor": "0.6 0.6 0.6 1.0"
    },
    "tags": {
        "brush": [],
        "brushface": [
            {
                "name": "skip",
                "attribs": [ "transparent" ],
                "match": "material",
                "pattern": "special/skip"
            }
        ]
    },
    "faceattribs": {
        "surfaceflags": [
            {
                "name": "sh_transparent",
                "description": "PSX semi-transparent prim (renders additively in-game)"
            },
            {
                "name": "sh_quad_b",
                "description": "Second triangle of a split SH quad"
            },
            {
                "name": "sh_global_plm",
                "description": "Face belongs to a model in the area's shared _GLB.PLM (edits affect every map using this area)"
            }
        ],
        "contentflags": []
    },
    "compilationTools": [
        {
            "name": "map2ipd",
            "description": "Path to map2ipd.py compiler (writes gamedata/load/BG IPDs)"
        }
    ]
}
